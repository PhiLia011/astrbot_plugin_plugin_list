name: astrbot_plugin_plugin_list
display_name: 插件清单
short_desc: 查看已安装插件清单（版本 / 启用状态 / 指令数），并可进入插件指令二级页
desc: |
  统计展示 AstrBot 已安装（已成功加载）的插件，并支持查看指定插件的全部指令。

  指令：
  - `插件列表`（别名 `插件清单`）：列出所有插件及其版本、作者、启用状态、指令数。
  - `查看xx插件帮助`：二级页面，展示该插件的全部指令（指令名、别名、参数、说明、所需权限）。例如 `查看延迟检测插件帮助`。

  以上输出都以图片发送（本地渲染，无需配置远端文转图服务），渲染失败时自动回退为纯文本。

  其他：
  - 无需配置、无第三方依赖、不保存会话状态，所有用户均可使用。
  - 提示文案中的唤醒前缀会自动跟随当前配置。
version: 1.2.1
author: PhiLia011
repo: https://github.com/PhiLia011/astrbot_plugin_plugin_list
astrbot_version: ">=4.16,<5"

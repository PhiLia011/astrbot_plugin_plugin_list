<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      /* 想换成自己的底图：把下面的 --bg-image 换成图片链接或 base64 即可，例如
         --bg-image: url('https://your-cdn.example.com/bg.jpg');
         也可删掉 --bg-image，只用渐变。 */
      :root {
        --bg-image: none;
        --card-radius: 28px;
        --ink: #1f2429;
        --muted: #6b7280;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        display: inline-block;
        padding: 40px;
        font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC",
          "Hiragino Sans GB", sans-serif;
        background-color: #141b2d;
        background-image: var(--bg-image),
          radial-gradient(circle at 18% 12%, #7c5cff 0%, rgba(124, 92, 255, 0) 55%),
          radial-gradient(circle at 88% 36%, #3ddad7 0%, rgba(61, 218, 215, 0) 45%),
          linear-gradient(150deg, #10162c 0%, #2e1c52 55%, #0c2234 100%);
        background-size: cover;
        background-position: center;
      }

      .card {
        box-sizing: border-box;
        width: 720px;
        padding: 34px 38px 26px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: var(--card-radius);
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.38);
      }

      .title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 18px;
        padding-bottom: 14px;
        border-bottom: 1px solid rgba(31, 36, 41, 0.12);
      }

      .title strong {
        font-size: 26px;
        letter-spacing: 0.5px;
        color: var(--ink);
      }

      .title span {
        font-size: 15px;
        color: var(--muted);
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: inherit;
        font-size: 21px;
        line-height: 1.62;
        color: var(--ink);
      }

      .footer {
        margin-top: 20px;
        text-align: right;
        font-size: 14px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">
        <strong>AstrBot 插件清单</strong>
        <span>v{{ version }}</span>
      </div>
      <pre>{{ text }}</pre>
      <div class="footer">AstrBot · 插件清单</div>
    </div>
  </body>
</html>
